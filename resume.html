
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Resume Builder - JobWizard AI</title>
<style>
body { background:#0a0f1c; color:white; font-family:Poppins,sans-serif; padding-top:80px; margin:0; }
h1,h2 { color:#00eaff; text-align:center; }
.container { width:80%; margin:auto; background:#111827; padding:40px; border-radius:20px; border:1px solid rgba(0,255,255,0.2); box-shadow:0 0 20px rgba(0,255,255,0.1); }
input, textarea, select { width:100%; padding:15px; margin-top:10px; margin-bottom:25px; background:#0e1525; border:1px solid rgba(0,255,255,0.3); border-radius:10px; color:white; font-size:16px; }
button { width:100%; padding:15px; font-size:18px; font-weight:600; border:none; cursor:pointer; background:linear-gradient(90deg,#00eaff,#1ef7ff); border-radius:12px; color:black; box-shadow:0 0 20px #00eaff; transition:0.3s; }
button:hover { transform:scale(1.05); box-shadow:0 0 40px #00eaff; }
.output { margin-top:30px; padding:25px; background:#0e1525; border:1px solid rgba(0,255,255,0.3); border-radius:15px; white-space:pre-wrap; font-size:18px; line-height:1.7; color:white; }
.back { text-align:center; margin-top:40px; }
.back button { width:auto; padding:12px 30px; }
.experience-block { background:#0e1525; padding:10px; margin-bottom:10px; border-radius:10px; }
.experience-block input, .experience-block textarea { margin-bottom:10px; }
</style>
</head>
<body>

<h1>AI Resume Builder</h1>

<div class="container">
    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Your Name" value="John Doe">

```
<label>Email</label>
<input type="email" id="email" placeholder="you@example.com" value="john@example.com">

<label>Phone</label>
<input type="text" id="phone" placeholder="+91 99999 99999" value="+91 98765 43210">

<label>Professional Summary</label>
<textarea id="summary" rows="5">Experienced frontend developer skilled in JavaScript, React, and building dynamic web applications.</textarea>

<label>Experience</label>
<div id="experienceList"></div>
<button id="addExpBtn" type="button">Add Experience</button>

<label>Skills (comma separated)</label>
<input type="text" id="skills" placeholder="JavaScript, Python, React" value="JavaScript, React, HTML, CSS">

<label>Template</label>
<select id="templateSelect">
    <option value="modern">Modern</option>
    <option value="minimal">Minimal</option>
    <option value="corporate">Corporate</option>
</select>

<button type="button" id="generateBtn">Generate Resume</button>
<button type="button" id="previewBtn">Preview / Print</button>

<div id="resumeOutput" class="output"></div>
```

</div>

<div class="back">
    <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let exps = [
        {title:'Frontend Developer', company:'Tech Solutions', period:'2022 – Present', desc:'Developed web applications using React and collaborated with design team.'},
        {title:'Intern', company:'WebSoft', period:'2021 – 2022', desc:'Assisted in building responsive websites and fixed bugs.'}
    ];

    function addExperience(exp={title:'Frontend Developer', company:'Company XYZ', period:'2021 – Present', desc:'Built features and collaborated with team.'}) {
        exps.push(exp);
        renderExpList();
    }

    function renderExpList() {
        const list = document.getElementById('experienceList');
        list.innerHTML = '';
        exps.forEach((e,i)=>{
            const block = document.createElement('div');
            block.className = 'experience-block';

            const titleInput = document.createElement('input');
            titleInput.placeholder = 'Title';
            titleInput.value = e.title;
            titleInput.addEventListener('input', ev => { exps[i].title = ev.target.value; generateResume(); });

            const companyInput = document.createElement('input');
            companyInput.placeholder = 'Company';
            companyInput.value = e.company;
            companyInput.addEventListener('input', ev => { exps[i].company = ev.target.value; generateResume(); });

            const periodInput = document.createElement('input');
            periodInput.placeholder = 'Period';
            periodInput.value = e.period;
            periodInput.addEventListener('input', ev => { exps[i].period = ev.target.value; generateResume(); });

            const descInput = document.createElement('textarea');
            descInput.placeholder = 'Description';
            descInput.value = e.desc;
            descInput.addEventListener('input', ev => { exps[i].desc = ev.target.value; generateResume(); });

            block.append(titleInput, companyInput, periodInput, descInput);
            list.appendChild(block);
        });
        generateResume();
    }

    function generateResume() {
        const name = document.getElementById('fullName').value || 'Your Name';
        const email = document.getElementById('email').value || 'email@example.com';
        const phone = document.getElementById('phone').value || '+91 99999 99999';
        const summary = document.getElementById('summary').value || '';
        const skills = (document.getElementById('skills').value || '').split(',').map(s => s.trim()).filter(Boolean);
        const template = document.getElementById('templateSelect').value;

        const color = template === 'modern' ? '#00eaff' : template === 'minimal' ? '#ffffff' : '#ffaa00';

        let html = `<div style="font-family:Poppins;color:white;padding:20px;">
            <h1 style="color:${color}">${name}</h1>
            <p>${email} | ${phone}</p>
            <h2>Summary</h2><p>${summary}</p>
            <h2>Experience</h2>`;
        exps.forEach(e => {
            html += `<p><b>${e.title}</b> at ${e.company} (${e.period})<br>${e.desc}</p>`;
        });
        html += `<h2>Skills</h2><p>${skills.join(', ')}</p></div>`;

        document.getElementById('resumeOutput').innerHTML = html;
    }

    function openInNewTab() {
        if (!validateInputs()) return;
        generateResume();
        const html = document.getElementById('resumeOutput').innerHTML;
        const w = window.open('', '_blank');
        if (!w) { alert('Popup blocked! Please allow popups.'); return; }
        w.document.body.innerHTML = html;
        w.document.title = 'Resume Preview';
        w.document.body.style.background = '#0a0f1c';
        w.document.body.style.color = 'white';
        w.document.body.style.fontFamily = 'Poppins';
        w.focus();
        w.print();
    }

    function validateInputs() {
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const skills = document.getElementById('skills').value.trim();

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^[0-9+\-\s()]{7,20}$/;

        if (!name) { alert('Please enter your full name.'); return false; }
        if (!email || !emailRegex.test(email)) { alert('Please enter a valid email.'); return false; }
        if (!phone || !phoneRegex.test(phone)) { alert('Please enter a valid phone number.'); return false; }
        if (!skills) { alert('Please enter at least one skill.'); return false; }

        for (let i = 0; i < exps.length; i++) {
            const e = exps[i];
            if (!e.title || !e.company || !e.period || !e.desc) {
                alert('Please fill out all experience fields.');
                return false;
            }
        }

        return true;
    }

    document.getElementById('addExpBtn').addEventListener('click', addExperience);
    document.getElementById('generateBtn').addEventListener('click', () => { if (validateInputs()) generateResume(); });
    document.getElementById('previewBtn').addEventListener('click', openInNewTab);

    ['fullName','email','phone','summary','skills','templateSelect'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', generateResume);
            if (id==='templateSelect') el.addEventListener('change', generateResume);
        }
    });

    renderExpList();
});
</script>

</body>
</html>
